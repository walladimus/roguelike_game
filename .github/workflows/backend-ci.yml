name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Tidy modules
        run: go mod tidy
      - name: Build all packages
        run: go build ./...
      # uncomment when you add tests:
      # - name: Run tests
      #   run: go test ./... -v
